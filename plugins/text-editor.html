<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本编辑器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; background: #f9fafb; height: 100vh; display: flex; flex-direction: column; }
h3 { margin-bottom: 12px; color: #111827; }
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
button { padding: 8px 14px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
button:hover { opacity: 0.9; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
textarea { flex: 1; width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-family: monospace; font-size: 13px; resize: none; }
.status { margin-top: 8px; font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
<h3>📝 文本编辑器</h3>
<div class="toolbar">
  <button onclick="openFile()">📂 打开文件</button>
  <button class="primary" onclick="saveFile()">💾 保存</button>
  <button onclick="saveAsNew()">💾 另存为新文件</button>
</div>
<textarea id="editor" placeholder="点击"打开文件"选择 Drive 中的文本文件进行编辑..."></textarea>
<div class="status" id="status">就绪</div>

<script>
// GitHub Drive 插件 API 封装
const GD = {
  call(action, data = {}) {
    return new Promise((resolve, reject) => {
      const id = Date.now() + Math.random();
      const handler = (e) => {
        if (e.data.type === 'gd-response' && e.data.id === id) {
          window.removeEventListener('message', handler);
          if (e.data.error) reject(new Error(e.data.error));
          else resolve(e.data.result);
        }
      };
      window.addEventListener('message', handler);
      window.parent.postMessage({ type: 'gd-api', id, action, data }, '*');
    });
  },
  listFiles(path = '/drive_home') { return this.call('listFiles', { path }); },
  downloadFile(path) { return this.call('downloadFile', { path }); },
  uploadFile(name, content, path = '/drive_home') { return this.call('uploadFile', { name, content, path }); },
  showToast(msg, type = 'info') { return this.call('showToast', { message: msg, type }); },
  getCurrentPath() { return this.call('getCurrentPath'); }
};

let currentFilePath = null;

async function openFile() {
  try {
    document.getElementById('status').textContent = '正在读取文件列表...';
    const files = await GD.listFiles();
    const textFiles = files.filter(f => !f.isFolder && /\.(txt|md|json|js|css|html|xml|csv|log)$/i.test(f.name));
    if (textFiles.length === 0) { alert('没有找到文本文件'); return; }
    const names = textFiles.map((f, i) => `${i+1}. ${f.path}`).join('\n');
    const idx = prompt('选择要打开的文件（输入序号）：\n' + names, '1');
    if (!idx) return;
    const file = textFiles[parseInt(idx) - 1];
    if (!file) return;
    document.getElementById('status').textContent = '正在下载 ' + file.name + '...';
    const content = await GD.downloadFile(file.path);
    document.getElementById('editor').value = content;
    currentFilePath = file.path;
    document.getElementById('status').textContent = '已打开: ' + file.path;
  } catch (e) {
    document.getElementById('status').textContent = '错误: ' + e.message;
    GD.showToast('打开失败: ' + e.message, 'error');
  }
}

async function saveFile() {
  if (!currentFilePath) { saveAsNew(); return; }
  try {
    const content = document.getElementById('editor').value;
    const name = currentFilePath.split('/').pop();
    const path = currentFilePath.substring(0, currentFilePath.lastIndexOf('/'));
    await GD.uploadFile(name, content, path);
    GD.showToast('保存成功', 'success');
    document.getElementById('status').textContent = '已保存: ' + currentFilePath;
  } catch (e) {
    GD.showToast('保存失败: ' + e.message, 'error');
  }
}

async function saveAsNew() {
  const name = prompt('输入文件名（如 note.txt）：', 'untitled.txt');
  if (!name) return;
  try {
    const content = document.getElementById('editor').value;
    const currentPath = await GD.getCurrentPath();
    await GD.uploadFile(name, content, currentPath);
    currentFilePath = currentPath + '/' + name;
    GD.showToast('保存成功', 'success');
    document.getElementById('status').textContent = '已保存为: ' + currentFilePath;
  } catch (e) {
    GD.showToast('保存失败: ' + e.message, 'error');
  }
}
</script>
</body>
</html>
