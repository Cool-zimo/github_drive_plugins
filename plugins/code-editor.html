<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码编辑器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; background: #1e1e1e; height: 100vh; display: flex; flex-direction: column; color: #d4d4d4; }
h3 { margin-bottom: 12px; color: #fff; }
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
button { padding: 8px 14px; border: 1px solid #3c3c3c; border-radius: 6px; background: #2d2d2d; color: #d4d4d4; cursor: pointer; font-size: 13px; }
button.primary { background: #0e639c; border-color: #0e639c; color: #fff; }
button:hover { background: #3c3c3c; }
select { padding: 8px 12px; border: 1px solid #3c3c3c; border-radius: 6px; background: #2d2d2d; color: #d4d4d4; font-size: 13px; }
.editor-container { flex: 1; display: flex; border: 1px solid #3c3c3c; border-radius: 8px; overflow: hidden; }
.line-numbers { background: #252526; padding: 12px 8px; text-align: right; color: #858585; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.6; user-select: none; min-width: 50px; }
textarea { flex: 1; padding: 12px; background: #1e1e1e; color: #d4d4d4; border: none; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.6; resize: none; outline: none; tab-size: 4; }
.status { margin-top: 8px; font-size: 12px; color: #858585; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<h3>💻 代码编辑器</h3>
<div class="toolbar">
  <button onclick="openFile()">📂 打开文件</button>
  <button class="primary" onclick="saveFile()">💾 保存</button>
  <button onclick="saveAsNew()">💾 另存为</button>
  <select id="language" onchange="updateLineNumbers()">
    <option value="javascript">JavaScript</option>
    <option value="python">Python</option>
    <option value="html">HTML</option>
    <option value="css">CSS</option>
    <option value="json">JSON</option>
    <option value="markdown">Markdown</option>
    <option value="plain">纯文本</option>
  </select>
  <button onclick="formatCode()">✨ 格式化</button>
</div>
<div class="editor-container">
  <div class="line-numbers" id="lineNumbers">1</div>
  <textarea id="editor" placeholder="在此输入代码..." oninput="updateLineNumbers()" onkeydown="handleTab(event)"></textarea>
</div>
<div class="status">
  <span id="status">就绪</span>
  <span id="cursorPos">行 1, 列 1</span>
</div>

<script>
const GD = {
  call(action, data = {}) {
    return new Promise((resolve, reject) => {
      const id = Date.now() + Math.random();
      const handler = (e) => {
        if (e.data.type === 'gd-response' && e.data.id === id) {
          window.removeEventListener('message', handler);
          if (e.data.error) reject(new Error(e.data.error));
          else resolve(e.data.result);
        }
      };
      window.addEventListener('message', handler);
      window.parent.postMessage({ type: 'gd-api', id, action, data }, '*');
    });
  },
  listFiles(path = '/drive_home') { return this.call('listFiles', { path }); },
  downloadFile(path) { return this.call('downloadFile', { path }); },
  uploadFile(name, content, path = '/drive_home') { return this.call('uploadFile', { name, content, path }); },
  showToast(msg, type = 'info') { return this.call('showToast', { message: msg, type }); },
};

let currentFile = null;

function updateLineNumbers() {
  const editor = document.getElementById('editor');
  const lines = editor.value.split('\n').length;
  const numbers = Array.from({length: lines}, (_, i) => i + 1).join('\n');
  document.getElementById('lineNumbers').textContent = numbers;
  updateCursorPos();
}

function updateCursorPos() {
  const editor = document.getElementById('editor');
  const pos = editor.selectionStart;
  const text = editor.value.substring(0, pos);
  const line = text.split('\n').length;
  const col = pos - text.lastIndexOf('\n');
  document.getElementById('cursorPos').textContent = `行 ${line}, 列 ${col}`;
}

function handleTab(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const editor = document.getElementById('editor');
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 4;
    updateLineNumbers();
  }
}

function formatCode() {
  const lang = document.getElementById('language').value;
  const editor = document.getElementById('editor');
  if (lang === 'json') {
    try {
      const obj = JSON.parse(editor.value);
      editor.value = JSON.stringify(obj, null, 4);
      updateLineNumbers();
      document.getElementById('status').textContent = 'JSON 格式化成功';
    } catch (e) {
      document.getElementById('status').textContent = 'JSON 格式错误: ' + e.message;
    }
  } else {
    editor.value = editor.value.replace(/\t/g, '    ');
    updateLineNumbers();
    document.getElementById('status').textContent = '已格式化（Tab 转空格）';
  }
}

async function openFile() {
  try {
    const files = await GD.listFiles();
    const codeFiles = files.filter(f => f.name && /\.(js|py|html|css|json|md|txt|ts|jsx|tsx|vue|java|c|cpp|go|rs|php)$/i.test(f.name));
    if (codeFiles.length === 0) { GD.showToast('没有找到代码文件', 'warning'); return; }
    const names = codeFiles.map((f, i) => `${i+1}. ${f.name}`).join('\n');
    const idx = prompt('选择要打开的文件:\n' + names, '1');
    if (!idx) return;
    const file = codeFiles[parseInt(idx) - 1];
    const content = await GD.downloadFile(file.path);
    document.getElementById('editor').value = content;
    currentFile = file;
    const ext = file.name.split('.').pop().toLowerCase();
    const langMap = {js:'javascript', py:'python', html:'html', css:'css', json:'json', md:'markdown', txt:'plain'};
    document.getElementById('language').value = langMap[ext] || 'plain';
    updateLineNumbers();
    document.getElementById('status').textContent = '已打开: ' + file.name;
    GD.showToast('文件已打开', 'success');
  } catch (e) { GD.showToast('打开失败: ' + e.message, 'error'); }
}

async function saveFile() {
  try {
    const content = document.getElementById('editor').value;
    if (currentFile) {
      await GD.uploadFile(currentFile.name, content);
    } else {
      const name = prompt('输入文件名:', 'untitled.js');
      if (!name) return;
      await GD.uploadFile(name, content);
      currentFile = { name };
    }
    document.getElementById('status').textContent = '已保存: ' + currentFile.name;
    GD.showToast('保存成功', 'success');
  } catch (e) { GD.showToast('保存失败: ' + e.message, 'error'); }
}

async function saveAsNew() {
  try {
    const content = document.getElementById('editor').value;
    const name = prompt('输入新文件名:', currentFile ? 'copy_' + currentFile.name : 'untitled.js');
    if (!name) return;
    await GD.uploadFile(name, content);
    currentFile = { name };
    document.getElementById('status').textContent = '已另存为: ' + name;
    GD.showToast('保存成功', 'success');
  } catch (e) { GD.showToast('保存失败: ' + e.message, 'error'); }
}

document.getElementById('editor').addEventListener('click', updateCursorPos);
document.getElementById('editor').addEventListener('keyup', updateCursorPos);
updateLineNumbers();
</script>
</body>
</html>
