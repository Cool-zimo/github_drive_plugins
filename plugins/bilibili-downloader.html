<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B站视频下载器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 20px; background: #f9fafb; }
h3 { margin-bottom: 16px; color: #111827; }
.section { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.section-title { font-size: 13px; font-weight: 600; color: #6b7280; margin-bottom: 10px; text-transform: uppercase; }
.input-group { margin-bottom: 12px; }
label { display: block; font-size: 13px; color: #374151; margin-bottom: 4px; }
input, select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
button { padding: 10px 20px; border: none; border-radius: 6px; background: #fb7299; color: #fff; cursor: pointer; font-size: 14px; }
button.secondary { background: #6b7280; }
.hint { margin-top: 12px; padding: 12px; background: #fef3c7; border-radius: 6px; font-size: 12px; color: #92400e; line-height: 1.5; }
.status { margin-top: 12px; font-size: 13px; color: #6b7280; padding: 10px; background: #f3f4f6; border-radius: 6px; }
.video-info { margin-top: 12px; padding: 12px; background: #f0f9ff; border-radius: 6px; display: none; }
.video-info img { width: 100%; border-radius: 6px; margin-bottom: 8px; }
</style>
</head>
<body>
<h3>📺 B站视频下载器</h3>
<div class="section">
<div class="section-title">后端配置</div>
<div class="input-group">
<label>后端服务地址</label>
<input type="text" id="backend" value="http://localhost:8787">
</div>
<button class="secondary" onclick="testBackend()">🔌 测试连接</button>
<span id="backendStatus" style="margin-left:8px;font-size:12px;"></span>
</div>
<div class="section">
<div class="section-title">视频下载</div>
<div class="input-group">
<label>视频链接（BV号或完整URL）</label>
<input type="text" id="url" placeholder="https://www.bilibili.com/video/BV1xx411c7mD">
</div>
<div class="input-group">
<label>清晰度</label>
<select id="qn">
<option value="16">360P</option><option value="32">480P</option>
<option value="64" selected>720P</option><option value="80">1080P</option>
</select>
</div>
<div class="input-group">
<label>保存到 Drive 路径</label>
<input type="text" id="path" value="/drive_home">
</div>
<button onclick="download()">⬇️ 解析并下载到 Drive</button>
</div>
<div class="video-info" id="videoInfo">
<img id="videoPic" src=""><h4 id="videoTitle"></h4><p id="videoDesc"></p>
</div>
<div class="status" id="status">就绪</div>
<div class="hint">
💡 <b>使用前请先启动后端服务</b><br>
1. 下载 github-drive-server 并运行<br>
2. 点击「测试连接」确认可用<br>
3. 仓库：<a href="https://github.com/Cool-zimo/github-drive-server" target="_blank">github-drive-server</a>
</div>
<script>
const GD = {
  call(action, data = {}) {
    return new Promise((resolve, reject) => {
      const id = Date.now() + Math.random();
      const handler = (e) => {
        if (e.data.type === 'gd-response' && e.data.id === id) {
          window.removeEventListener('message', handler);
          if (e.data.error) reject(new Error(e.data.error));
          else resolve(e.data.result);
        }
      };
      window.addEventListener('message', handler);
      window.parent.postMessage({ type: 'gd-api', id, action, data }, '*');
    });
  },
  uploadFile(name, content, path) { return this.call('uploadFile', { name, content, path }); },
  showToast(msg, type) { return this.call('showToast', { message: msg, type }); },
  getCurrentPath() { return this.call('getCurrentPath'); }
};
function getBackend() { return document.getElementById('backend').value.trim().replace(/\/$/, ''); }
async function testBackend() {
  const s = document.getElementById('backendStatus');
  s.textContent = '测试中...';
  try {
    const d = await fetch(getBackend() + '/health').then(r => r.json());
    s.textContent = d.status === 'running' ? '✅ 已连接 (v' + d.version + ')' : '❌ 异常';
    s.style.color = d.status === 'running' ? '#16a34a' : '#dc2626';
  } catch (e) { s.textContent = '❌ ' + e.message; s.style.color = '#dc2626'; }
}
async function download() {
  const url = document.getElementById('url').value.trim();
  const qn = document.getElementById('qn').value;
  const path = document.getElementById('path').value.trim();
  const st = document.getElementById('status');
  if (!url) { alert('请输入视频链接'); return; }
  st.textContent = '正在解析视频...';
  try {
    const data = await fetch(getBackend() + '/bilibili?url=' + encodeURIComponent(url) + '&qn=' + qn).then(r => r.json());
    if (data.error) throw new Error(data.error);
    document.getElementById('videoInfo').style.display = 'block';
    document.getElementById('videoPic').src = data.pic || '';
    document.getElementById('videoTitle').textContent = data.title || '';
    document.getElementById('videoDesc').textContent = data.desc || '';
    let videoUrl = '';
    if (data.play && data.play.durl && data.play.durl.length > 0) videoUrl = data.play.durl[0].url;
    else if (data.play && data.play.dash && data.play.dash.video) videoUrl = data.play.dash.video[0].baseUrl || data.play.dash.video[0].base_url;
    if (!videoUrl) throw new Error('未找到视频地址（高清可能需要登录Cookie）');
    st.textContent = '正在下载视频...';
    const vr = await fetch(getBackend() + '/proxy?url=' + encodeURIComponent(videoUrl));
    if (!vr.ok) throw new Error('下载失败: HTTP ' + vr.status);
    const blob = await vr.blob();
    st.textContent = '正在上传到 Drive...';
    const title = (data.title || 'bilibili-video').replace(/[\\/:*?"<>|]/g, '_');
    const ab = await blob.arrayBuffer();
    const u8 = new Uint8Array(ab);
    let bin = '';
    for (let i = 0; i < u8.length; i += 8192) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
    await GD.uploadFile(title + '.mp4', btoa(bin), path);
    GD.showToast('下载完成: ' + title + '.mp4', 'success');
    st.textContent = '✅ 已保存到 Drive';
  } catch (e) {
    st.textContent = '❌ ' + e.message;
    GD.showToast('下载失败: ' + e.message, 'error');
  }
}
GD.getCurrentPath().then(p => { if (p) document.getElementById('path').value = p; }).catch(() => {});
</script>
</body>
</html>
