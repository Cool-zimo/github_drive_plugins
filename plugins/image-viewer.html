<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片查看器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; background: #1a1a1a; color: #fff; height: 100vh; display: flex; flex-direction: column; }
h3 { margin-bottom: 12px; }
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
button { padding: 8px 14px; border: 1px solid #444; border-radius: 6px; background: #333; color: #fff; cursor: pointer; font-size: 13px; }
button:hover { background: #444; }
.viewer { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; border-radius: 8px; }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.2s; }
.file-list { margin-top: 12px; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
.thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 2px solid transparent; }
.thumb.active { border-color: #3b82f6; }
.status { margin-top: 8px; font-size: 12px; color: #999; }
</style>
</head>
<body>
<h3>🖼️ 图片查看器</h3>
<div class="toolbar">
  <button onclick="loadImages()">📂 加载 Drive 图片</button>
  <button onclick="zoom(1.2)">🔍+</button>
  <button onclick="zoom(0.8)">🔍-</button>
  <button onclick="rotate()">🔄 旋转</button>
</div>
<div class="viewer"><img id="mainImg" style="display:none;"></div>
<div class="file-list" id="thumbs"></div>
<div class="status" id="status">点击"加载 Drive 图片"开始</div>
<script>
const GD = {
  call(action, data = {}) {
    return new Promise((resolve, reject) => {
      const id = Date.now() + Math.random();
      const handler = (e) => {
        if (e.data.type === 'gd-response' && e.data.id === id) {
          window.removeEventListener('message', handler);
          if (e.data.error) reject(new Error(e.data.error));
          else resolve(e.data.result);
        }
      };
      window.addEventListener('message', handler);
      window.parent.postMessage({ type: 'gd-api', id, action, data }, '*');
    });
  },
  listFiles(path) { return this.call('listFiles', { path }); },
  downloadFile(path) { return this.call('downloadFile', { path }); }
};

let images = [];
let currentIdx = 0;
let rotation = 0;
let scale = 1;

async function loadImages() {
  try {
    document.getElementById('status').textContent = '正在扫描...';
    const files = await GD.listFiles();
    images = files.filter(f => !f.isFolder && /\.(png|jpg|jpeg|gif|webp|svg|bmp)$/i.test(f.name));
    if (images.length === 0) { document.getElementById('status').textContent = '没有找到图片'; return; }
    const thumbs = document.getElementById('thumbs');
    thumbs.innerHTML = '';
    for (let i = 0; i < images.length; i++) {
      const content = await GD.downloadFile(images[i].path);
      const blob = new Blob([content], { type: 'image/*' });
      const url = URL.createObjectURL(blob);
      images[i].url = url;
      const img = document.createElement('img');
      img.src = url; img.className = 'thumb' + (i === 0 ? ' active' : '');
      img.onclick = () => showImage(i);
      thumbs.appendChild(img);
    }
    showImage(0);
    document.getElementById('status').textContent = `共 ${images.length} 张图片`;
  } catch (e) {
    document.getElementById('status').textContent = '错误: ' + e.message;
  }
}

function showImage(idx) {
  currentIdx = idx; rotation = 0; scale = 1;
  const img = document.getElementById('mainImg');
  img.src = images[idx].url; img.style.display = 'block';
  img.style.transform = 'rotate(0deg) scale(1)';
  document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === idx));
}

function zoom(factor) { scale *= factor; updateTransform(); }
function rotate() { rotation += 90; updateTransform(); }
function updateTransform() {
  document.getElementById('mainImg').style.transform = `rotate(${rotation}deg) scale(${scale})`;
}
</script>
</body>
</html>
