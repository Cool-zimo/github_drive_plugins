<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学题库</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
.container { max-width: 600px; margin: 0 auto; }
h3 { color: #fff; margin-bottom: 16px; text-align: center; font-size: 24px; }
.card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); margin-bottom: 16px; }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.menu-btn { padding: 20px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; color: #fff; }
.menu-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
.menu-btn.primary { background: linear-gradient(135deg, #667eea, #764ba2); }
.menu-btn.secondary { background: linear-gradient(135deg, #f093fb, #f5576c); }
.menu-btn.success { background: linear-gradient(135deg, #4facfe, #00f2fe); }
.menu-btn.warning { background: linear-gradient(135deg, #fa709a, #fee140); }
.question-display { text-align: center; padding: 40px 0; }
.question-text { font-size: 48px; font-weight: 700; color: #111827; margin-bottom: 24px; }
.question-num { font-size: 14px; color: #6b7280; margin-bottom: 8px; }
.answer-input { width: 100%; padding: 16px; font-size: 24px; text-align: center; border: 2px solid #e5e7eb; border-radius: 12px; outline: none; transition: border-color 0.2s; }
.answer-input:focus { border-color: #667eea; }
.answer-input.correct { border-color: #10b981; background: #ecfdf5; }
.answer-input.wrong { border-color: #ef4444; background: #fef2f2; }
.submit-btn { width: 100%; padding: 16px; margin-top: 16px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; }
.submit-btn:hover { opacity: 0.9; }
.feedback { text-align: center; padding: 16px; margin-top: 16px; border-radius: 12px; font-size: 18px; font-weight: 600; display: none; }
.feedback.correct { background: #ecfdf5; color: #065f46; display: block; }
.feedback.wrong { background: #fef2f2; color: #991b1b; display: block; }
.timer { text-align: center; font-size: 14px; color: #6b7280; margin-top: 12px; }
.result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
.stat-item { text-align: center; padding: 16px; background: #f9fafb; border-radius: 12px; }
.stat-value { font-size: 28px; font-weight: 700; color: #667eea; }
.stat-label { font-size: 12px; color: #6b7280; margin-top: 4px; }
.history-item { padding: 12px; border-bottom: 1px solid #e5e7eb; cursor: pointer; transition: background 0.2s; }
.history-item:hover { background: #f9fafb; }
.history-date { font-size: 14px; font-weight: 600; color: #374151; }
.history-meta { font-size: 12px; color: #6b7280; margin-top: 4px; }
.problem-list { max-height: 400px; overflow-y: auto; }
.problem-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-family: monospace; font-size: 14px; }
.back-btn { padding: 10px 20px; background: #f3f4f6; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 16px; }
.back-btn:hover { background: #e5e7eb; }
.detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; }
.detail-row .q { color: #374151; }
.detail-row .a { font-weight: 600; }
.detail-row.correct .a { color: #10b981; }
.detail-row.wrong .a { color: #ef4444; }
</style>
</head>
<body>
<div class="container">
  <h3>🧮 数学题库</h3>
  <div id="app" class="card"></div>
</div>

<script>
const GD = {
  call(action, data = {}) {
    return new Promise((resolve, reject) => {
      const id = Date.now() + Math.random();
      const handler = (e) => {
        if (e.data.type === 'gd-response' && e.data.id === id) {
          window.removeEventListener('message', handler);
          if (e.data.error) reject(new Error(e.data.error));
          else resolve(e.data.result);
        }
      };
      window.addEventListener('message', handler);
      window.parent.postMessage({ type: 'gd-api', id, action, data }, '*');
    });
  },
  listFiles(path = '/drive_home') { return this.call('listFiles', { path }); },
  downloadFile(path) { return this.call('downloadFile', { path }); },
  uploadFile(name, content, path = '/drive_home') { return this.call('uploadFile', { name, content, path }); },
  showToast(msg, type = 'info') { return this.call('showToast', { message: msg, type }); },
};

const app = document.getElementById('app');
let history = [];
let currentSession = null;

// 历史记录管理
async function loadHistory() {
  try {
    const content = await GD.downloadFile('/drive_home/math_history.json');
    history = JSON.parse(content);
  } catch (e) { history = []; }
}

async function saveHistory() {
  try {
    await GD.uploadFile('math_history.json', JSON.stringify(history, null, 2));
  } catch (e) { GD.showToast('历史记录保存失败', 'error'); }
}

// 随机出题
function randomQuestion() {
  const keys = Object.keys(mathBank);
  const key = keys[Math.floor(Math.random() * keys.length)];
  return { key, ...mathBank[key] };
}

// 主菜单
function showMenu() {
  app.innerHTML = `
    <div class="menu">
      <button class="menu-btn primary" onclick="startTest()">📝 开始练习</button>
      <button class="menu-btn secondary" onclick="showProblems()">📖 题库总览</button>
      <button class="menu-btn success" onclick="showHistory()">📜 历史记录</button>
      <button class="menu-btn warning" onclick="clearHistory()">🗑️ 清空记录</button>
    </div>
    <div style="text-align:center;margin-top:16px;font-size:13px;color:#6b7280;">
      共 ${Object.keys(mathBank).length} 道题目 | 历史记录: ${history.length} 次
    </div>
  `;
}

// 开始测试
async function startTest() {
  const num = prompt('要做多少道题？', '10');
  if (!num || isNaN(num) || num <= 0) return;
  
  currentSession = {
    total: parseInt(num),
    current: 0,
    correct: 0,
    totalTime: 0,
    fastest: Infinity,
    details: [],
    startTime: null,
    currentQ: null
  };
  
  nextQuestion();
}

function nextQuestion() {
  if (currentSession.current >= currentSession.total) {
    finishTest();
    return;
  }
  
  currentSession.current++;
  currentSession.currentQ = randomQuestion();
  currentSession.startTime = Date.now();
  
  const q = currentSession.currentQ;
  let display = '';
  if (q.cat === '^') display = `${q.a}^${q.b}`;
  else if (q.cat === '/') display = `${q.a}/${q.b}`;
  else display = `${q.a} × ${q.b}`;
  
  app.innerHTML = `
    <div class="question-num">第 ${currentSession.current} / ${currentSession.total} 题</div>
    <div class="question-display">
      <div class="question-text">${display} = ?</div>
    </div>
    <input type="text" id="answer" class="answer-input" placeholder="输入答案" autocomplete="off">
    <button class="submit-btn" onclick="submitAnswer()">提交答案 (Enter)</button>
    <div class="feedback" id="feedback"></div>
    <div class="timer" id="timer">⏱️ 0.00s</div>
  `;
  
  const input = document.getElementById('answer');
  input.focus();
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitAnswer();
  });
  
  // 计时器
  currentSession.timerInterval = setInterval(() => {
    const elapsed = (Date.now() - currentSession.startTime) / 1000;
    document.getElementById('timer').textContent = `⏱️ ${elapsed.toFixed(2)}s`;
  }, 50);
}

function submitAnswer() {
  const input = document.getElementById('answer');
  const userAns = input.value.trim();
  if (!userAns) return;
  
  clearInterval(currentSession.timerInterval);
  const elapsed = (Date.now() - currentSession.startTime) / 1000;
  currentSession.totalTime += elapsed;
  if (elapsed < currentSession.fastest) currentSession.fastest = elapsed;
  
  const q = currentSession.currentQ;
  const correctAns = q.ans;
  const isCorrect = parseFloat(userAns) === correctAns || 
                    (q.cat === '*' && (userAns === `${q.a}${q.cat}${q.b}` || userAns === `${q.b}${q.cat}${q.a}`));
  
  if (isCorrect) currentSession.correct++;
  
  currentSession.details.push({
    question: q.cat === '^' ? `${q.a}^${q.b}` : q.cat === '/' ? `${q.a}/${q.b}` : `${q.a}×${q.b}`,
    userAnswer: userAns,
    correctAnswer: correctAns,
    correct: isCorrect,
    time: elapsed.toFixed(2)
  });
  
  const feedback = document.getElementById('feedback');
  input.classList.add(isCorrect ? 'correct' : 'wrong');
  feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
  feedback.innerHTML = isCorrect ? '✅ 正确！' : `❌ 错误！正确答案: ${correctAns}`;
  
  setTimeout(() => nextQuestion(), 1000);
}

function finishTest() {
  const avg = currentSession.totalTime / currentSession.total;
  const record = {
    date: new Date().toLocaleString('zh-CN'),
    total: currentSession.total,
    correct: currentSession.correct,
    accuracy: ((currentSession.correct / currentSession.total) * 100).toFixed(1),
    totalTime: currentSession.totalTime.toFixed(2),
    avgTime: avg.toFixed(2),
    fastest: currentSession.fastest === Infinity ? '0' : currentSession.fastest.toFixed(2),
    details: currentSession.details
  };
  
  history.unshift(record);
  saveHistory();
  
  app.innerHTML = `
    <button class="back-btn" onclick="showMenu()">← 返回菜单</button>
    <h4 style="text-align:center;margin-bottom:16px;">🏆 练习完成！</h4>
    <div class="result-stats">
      <div class="stat-item">
        <div class="stat-value">${record.correct}/${record.total}</div>
        <div class="stat-label">正确数</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">${record.accuracy}%</div>
        <div class="stat-label">正确率</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">${record.avgTime}s</div>
        <div class="stat-label">平均用时</div>
      </div>
    </div>
    <div class="result-stats">
      <div class="stat-item">
        <div class="stat-value">${record.totalTime}s</div>
        <div class="stat-label">总用时</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">${record.fastest}s</div>
        <div class="stat-label">最快一题</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">${record.date.split(' ')[1] || ''}</div>
        <div class="stat-label">完成时间</div>
      </div>
    </div>
    <div style="margin-top:16px;">
      <h5 style="margin-bottom:8px;">📋 答题详情</h5>
      ${record.details.map((d, i) => `
        <div class="detail-row ${d.correct ? 'correct' : 'wrong'}">
          <span class="q">${i+1}. ${d.question} = ${d.userAnswer}</span>
          <span class="a">${d.correct ? '✅' : '❌ ' + d.correctAnswer} (${d.time}s)</span>
        </div>
      `).join('')}
    </div>
  `;
}

// 题库总览
function showProblems() {
  const problems = Object.entries(mathBank);
  app.innerHTML = `
    <button class="back-btn" onclick="showMenu()">← 返回菜单</button>
    <h4 style="margin-bottom:12px;">📖 题库总览 (${problems.length}题)</h4>
    <div class="problem-list">
      ${problems.map(([key, val]) => `
        <div class="problem-row">
          <span>${key}</span>
          <span>= ${val.ans}</span>
        </div>
      `).join('')}
    </div>
  `;
}

// 历史记录
function showHistory() {
  if (history.length === 0) {
    app.innerHTML = `
      <button class="back-btn" onclick="showMenu()">← 返回菜单</button>
      <div style="text-align:center;padding:40px;color:#9ca3af;">暂无历史记录</div>
    `;
    return;
  }
  
  app.innerHTML = `
    <button class="back-btn" onclick="showMenu()">← 返回菜单</button>
    <h4 style="margin-bottom:12px;">📜 历史记录</h4>
    ${history.map((r, i) => `
      <div class="history-item" onclick="showHistoryDetail(${i})">
        <div class="history-date">${r.date}</div>
        <div class="history-meta">${r.correct}/${r.total} 正确 | 正确率 ${r.accuracy}% | 平均 ${r.avgTime}s/题</div>
      </div>
    `).join('')}
  `;
}

function showHistoryDetail(idx) {
  const r = history[idx];
  app.innerHTML = `
    <button class="back-btn" onclick="showHistory()">← 返回列表</button>
    <h4 style="margin-bottom:12px;">📊 ${r.date}</h4>
    <div class="result-stats">
      <div class="stat-item">
        <div class="stat-value">${r.correct}/${r.total}</div>
        <div class="stat-label">正确数</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">${r.accuracy}%</div>
        <div class="stat-label">正确率</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">${r.avgTime}s</div>
        <div class="stat-label">平均用时</div>
      </div>
    </div>
    <div style="margin-top:16px;">
      ${r.details.map((d, i) => `
        <div class="detail-row ${d.correct ? 'correct' : 'wrong'}">
          <span class="q">${i+1}. ${d.question} = ${d.userAnswer}</span>
          <span class="a">${d.correct ? '✅' : '❌ ' + d.correctAnswer}</span>
        </div>
      `).join('')}
    </div>
  `;
}

async function clearHistory() {
  if (!confirm('确定要清空所有历史记录吗？')) return;
  history = [];
  await saveHistory();
  GD.showToast('历史记录已清空', 'success');
  showMenu();
}

// 初始化
loadHistory().then(showMenu);
</script>
</body>
</html>
