<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 - GitHub Drive</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#fff;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden}
h1{font-size:24px;margin-bottom:10px;color:#4ade80}
#score{font-size:18px;margin-bottom:10px}
#highScore{font-size:14px;color:#fbbf24;margin-bottom:10px}
canvas{border:2px solid #4ade80;border-radius:8px;background:#16213e}
#controls{margin-top:12px;font-size:12px;color:#94a3b8;text-align:center}
#gameOver{position:absolute;display:none;background:rgba(0,0,0,.8);padding:30px;border-radius:12px;text-align:center}
#gameOver h2{color:#f87171;margin-bottom:10px}
#gameOver button{margin-top:10px;padding:8px 20px;background:#4ade80;border:none;border-radius:6px;color:#000;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<h1>🐍 贪吃蛇</h1>
<div id="score">分数: 0</div>
<div id="highScore">最高分: 加载中...</div>
<canvas id="game" width="400" height="400"></canvas>
<div id="controls">方向键 / WASD 控制 · 空格暂停</div>
<div id="gameOver">
<h2>游戏结束</h2>
<p id="finalScore"></p>
<button onclick="restart()">再来一局</button>
</div>
<script>
const GD={call(a,d={}){return new Promise((res,rej)=>{const id=Date.now()+Math.random();const h=e=>{if(e.data.type==='gd-response'&&e.data.id===id){window.removeEventListener('message',h);e.data.error?rej(new Error(e.data.error)):res(e.data.result)}};window.addEventListener('message',h);window.parent.postMessage({type:'gd-api',id,action:a,data:d},'*')})},uploadFile(n,c,p){return this.call('uploadFile',{name:n,content:c,path:p})},showToast(m,t){return this.call('showToast',{message:m,type})}};
const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');
const gridSize=20;const tileCount=canvas.width/gridSize;
let snake,food,dx,dy,score,gameLoop,paused,highScore=0;
async function loadHighScore(){try{const files=await GD.call('listFiles',{path:'/games/snake'});const sf=files.find(f=>f.name==='save.json');if(sf){const c=await GD.call('getFileContent',{path:'/games/snake/save.json'});highScore=JSON.parse(atob(c.content)).highScore||0}}catch(e){}document.getElementById('highScore').textContent='最高分: '+highScore}
async function saveHighScore(){if(score<=highScore)return;highScore=score;document.getElementById('highScore').textContent='最高分: '+highScore;try{await GD.call('uploadFile',{name:'save.json',content:btoa(JSON.stringify({highScore,lastPlayed:new Date().toISOString()})),path:'/games/snake'});GD.showToast('新纪录已保存到Drive!','success')}catch(e){}}
function init(){snake=[{x:10,y:10}];dx=1;dy=0;score=0;paused=false;placeFood();document.getElementById('score').textContent='分数: 0';document.getElementById('gameOver').style.display='none';if(gameLoop)clearInterval(gameLoop);gameLoop=setInterval(update,100)}
function placeFood(){food={x:Math.floor(Math.random()*tileCount),y:Math.floor(Math.random()*tileCount)}}
function update(){if(paused)return;const head={x:snake[0].x+dx,y:snake[0].y+dy};if(head.x<0||head.x>=tileCount||head.y<0||head.y>=tileCount){gameOver();return}for(let s of snake){if(s.x===head.x&&s.y===head.y){gameOver();return}}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;document.getElementById('score').textContent='分数: '+score;placeFood()}else{snake.pop()}draw()}
function draw(){ctx.fillStyle='#16213e';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#f87171';ctx.fillRect(food.x*gridSize,food.y*gridSize,gridSize-2,gridSize-2);snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#4ade80':'#22c55e';ctx.fillRect(s.x*gridSize,s.y*gridSize,gridSize-2,gridSize-2)})}
function gameOver(){clearInterval(gameLoop);saveHighScore();document.getElementById('finalScore').textContent='得分: '+score;document.getElementById('gameOver').style.display='block'}
function restart(){init()}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if((k==='arrowup'||k==='w')&&dy!==1){dx=0;dy=-1}else if((k==='arrowdown'||k==='s')&&dy!==-1){dx=0;dy=1}else if((k==='arrowleft'||k==='a')&&dx!==1){dx=-1;dy=0}else if((k==='arrowright'||k==='d')&&dx!==-1){dx=1;dy=0}else if(k===' '){paused=!paused}});
loadHighScore();init();
</script>
</body>
</html>
